<div class="container pt-4">
  <div class="form-group">
    <div class="col-md-6">
      <h2>{{'elovate.password-reset.header' | translate}}</h2>
      <input type="password" class="form-control mb-2" id="current-password" name="currentPassword"
             [placeholder]="'elovate.password-reset.placeholder.old-password' | translate"
             [(ngModel)]="passwordResetDto.oldPassword">
      <input type="password" class="form-control mb-2" id="new-password" name="newPassword"
             [placeholder]="'elovate.login-reg.placeholder.password' | translate"
             [(ngModel)]="passwordResetDto.newPassword" required>
      <input type="password" class="form-control mb-2" id="confirm-new-password" name="confirmNewPassword"
             [placeholder]="'elovate.login-reg.placeholder.password-repeat' | translate"
             [(ngModel)]="passwordResetDto.newPasswordRepeated" required>
      <button type="button" class="btn btn-secondary"
              (click)="resetPassword()"
      >{{'elovate.password-reset.submit' | translate}}</button>
    </div>
  </div>
</div>
