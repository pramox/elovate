<div class="wrapper-center">
  <div class="game-detail">
    <div class="flexbox-panel">
      <div class="flexbox-item">
        <h2>{{gameDetailDTO.name}}</h2>
        <form *ngIf="gameDetailDTO?.developerDetails">
          <div class="form-group">
            <label for="genre">{{"elovate.game-detail.lbl.genre" | translate}}</label>
            <input class="form-control" type="text" id="genre" name="genre"
                   [value]="genre2LabelMapper[gameDetailDTO.genre] | translate" readonly>
          </div>
          <div class="form-group">
            <label for="developerName">{{"elovate.game-detail.lbl.developer" | translate}}</label>
            <input class="form-control" type="text" id="developerName" name="developerName"
                   [value]="gameDetailDTO.developerDetails.nickname" readonly>
          </div>
          <div class="form-group">
            <label for="developerEmail">{{"elovate.game-detail.lbl.email" | translate}}</label>
            <input class="form-control" type="text" id="developerEmail" name="developerEmail"
                   [value]="gameDetailDTO.developerDetails.email" readonly>
          </div>
          <div class="form-group">
            <label for="playersPerTeam">{{"elovate.game-detail.lbl.players-per-team" | translate}}</label>
            <input class="form-control" type="text" id="playersPerTeam" name="playersPerTeam"
                   [value]="gameDetailDTO.playersPerTeam" readonly>
          </div>
          <button *ngIf="isAdmin()" class="btn btn-secondary" type="button" (click)="redirectToParams()">
            {{ "elovate.game-detail.edit-params" | translate}}
          </button>
        </form>
      </div>
      <div class="flexbox-item">
        <img *ngIf="gameDetailDTO.image" src="{{gameDetailDTO.image}}" alt="Game Application Image"
             class="responsive-image">
        <img *ngIf="!gameDetailDTO.image" src="../../../assets/default-game-cover.png" alt="Game Application Image"
             class="responsive-image">
      </div>
    </div>
    <div class="instructions" *ngIf="isDeveloper()">
      <h2>{{"elovate.game-detail.instruction.header" | translate}}</h2>
      <p>{{"elovate.game-detail.instruction.content" | translate}}</p>
      <hr>
      <app-api-key [gameId]="gameDetailDTO.id"></app-api-key>
      <hr>
      <h2>{{"elovate.game-detail.code-examples.header" | translate}}</h2>
      <div class="button-row">

<textarea *ngIf="languages.java" highlight-js [options]="{}" [lang]="'java'">
import java.io.BufferedReader;
import java.io.InputStreamReader;
import java.net.HttpURLConnection;
import java.net.URL;

public class ApiAccessWithKey {

    public static void main(String[] args) {
        try {
            // {{"elovate.game-detail.java.comment.0" | translate}}
            String apiKey = "YOUR_API_KEY";

            // {{"elovate.game-detail.java.comment.1" | translate}}
            String urlString = "http://example.com/api/endpoint";
            URL url = new URL(urlString);
            HttpURLConnection connection = (HttpURLConnection) url.openConnection();

            // {{"elovate.game-detail.java.comment.2" | translate}}
            connection.setRequestMethod("GET");

            // {{"elovate.game-detail.java.comment.3" | translate}}
            connection.setRequestProperty("Authorization", "Bearer " + apiKey);

            // {{"elovate.game-detail.java.comment.4" | translate}}
            int responseCode = connection.getResponseCode();
            System.out.println("Response Code: " + responseCode);

            // {{"elovate.game-detail.java.comment.5" | translate}}
            BufferedReader in = new BufferedReader(new InputStreamReader(connection.getInputStream()));
            String inputLine;
            StringBuffer response = new StringBuffer();

            while ((inputLine = in.readLine()) != null) {
                response.append(inputLine);
            }
            in.close();

            // {{"elovate.game-detail.java.comment.6" | translate}}
            System.out.println(response.toString());

        } catch (Exception e) {
            e.printStackTrace();
        }
    }
}
</textarea>

<textarea *ngIf="languages.python" highlight-js [options]="{}" [lang]="'python'">
import requests

def access_api_with_key():
    # {{"elovate.game-detail.python.comment.0" | translate}}
    api_key = 'YOUR_API_KEY'

    # {{"elovate.game-detail.python.comment.1" | translate}}
    url = 'http://example.com/api/endpoint'

    # {{"elovate.game-detail.python.comment.2" | translate}}
    headers = {
        'Authorization': f'Bearer {api_key}'
    }

    # {{"elovate.game-detail.python.comment.3" | translate}}
    response = requests.get(url, headers=headers)

    # {{"elovate.game-detail.python.comment.4" | translate}}
    if response.status_code == 200:
        # {{"elovate.game-detail.python.comment.5" | translate}}
        print(response.text)
    else:
        # {{"elovate.game-detail.python.comment.6" | translate}}
        print(f"Error: Received response with status code {response.status_code}")

# {{"elovate.game-detail.python.comment.7" | translate}}
access_api_with_key()
</textarea>

<textarea *ngIf="languages.cpp" highlight-js [options]="{}" [lang]="'c++'">
#include <iostream>
#include <curl/curl.h>
#include <string>

size_t WriteCallback(void *contents, size_t size, size_t nmemb, std::string *s) {
    size_t newLength = size * nmemb;
    s->append((char*)contents, newLength);
    return newLength;
}

int main() {
    // {{"elovate.game-detail.cpp.comment.0" | translate}}
    curl_global_init(CURL_GLOBAL_ALL);
    CURL *curl = curl_easy_init();

    if(curl) {
        // {{"elovate.game-detail.cpp.comment.1" | translate}}
        std::string apiKey = "YOUR_API_KEY";

        // {{"elovate.game-detail.cpp.comment.2" | translate}}
        std::string url = "http://example.com/api/endpoint";
        std::string readBuffer;

        // {{"elovate.game-detail.cpp.comment.3" | translate}}
        curl_easy_setopt(curl, CURLOPT_URL, url.c_str());
        curl_easy_setopt(curl, CURLOPT_FOLLOWLOCATION, 1L);

        // {{"elovate.game-detail.cpp.comment.4" | translate}}
        curl_easy_setopt(curl, CURLOPT_WRITEFUNCTION, WriteCallback);
        curl_easy_setopt(curl, CURLOPT_WRITEDATA, &readBuffer);

        // {{"elovate.game-detail.cpp.comment.5" | translate}}
        struct curl_slist *headers = NULL;
        headers = curl_slist_append(headers, ("Authorization: Bearer " + apiKey).c_str());
        curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);

        // {{"elovate.game-detail.cpp.comment.6" | translate}}
        CURLcode res = curl_easy_perform(curl);

        if(res != CURLE_OK) {
            std::cerr << "curl_easy_perform() failed: " << curl_easy_strerror(res) << std::endl;
        } else {
            std::cout << readBuffer << std::endl;
        }

        // {{"elovate.game-detail.cpp.comment.7" | translate}}
        curl_slist_free_all(headers);
        curl_easy_cleanup(curl);
    }

    curl_global_cleanup();
    return 0;
}
